function calculate(answers){
 if(!Array.isArray(answers)||answers.length!==questions.length||answers.some(v=>!Number.isInteger(v)||v<0||v>3)) throw new Error('请完成全部21题后再查看结果。');
 const scores=dimensions.map((d,index)=>{const qs=questions.filter(q=>q.dimension===index);const value=Math.round(qs.reduce((s,q)=>s+answers[q.id-1],0)/(qs.length*3)*100);return {...d,value,count:qs.length,level:value<34?'较少出现':value<67?'有时出现':'较常出现',reading:value<34?d.low:value<67?d.mid:d.high};});
 const total=Math.round(answers.reduce((a,b)=>a+b,0)/63*100);const peak=Math.max(...scores.map(d=>d.value));const leaders=scores.filter(d=>d.value===peak);let kind,title,summary;

 else if(leaders.length>1){kind='mixed';title='你的压力来自不止一个方向';summary='本次回答中，'+leaders.map(d=>d.name).join('、')+'并列最高。它们可能在不同场景中出现，单一的类型不足以概括这份结果。';}

</script><script>'use strict';
const {questions,dimensions,calculate}=Merit;
const main=document.querySelector('main');const KEY='self-scale-v1';let answers=Array(21).fill(null),current=0,finished=false,storageAvailable=true,result=null,returnToReview=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===1&&Array.isArray(saved.answers)&&saved.answers.length===21&&saved.answers.every(v=>v===null||(Number.isInteger(v)&&v>=0&&v<=3))){answers=saved.answers;current=Number.isInteger(saved.current)?Math.max(0,Math.min(20,saved.current)):0;finished=saved.finished===true&&answers.every(v=>v!==null);}}catch{storageAvailable=false;}
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,answers,current,finished}));}catch{storageAvailable=false;}}
function focusMain(){main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function storageText(){return storageAvailable?'进度仅保存在当前浏览器；清除浏览器数据后会消失。':'浏览器无法保存进度，请保持本页打开直到完成。';}
function home(){const count=answers.filter(v=>v!==null).length;main.innerHTML=`<section class="intro"><h1>你对自己，<br>有多少隐形要求？</h1><p class="lead">从工作、休息和人际关系里的小反应，看看比较、评价和“必须优秀”的念头，怎样影响你的日常。</p><div class="facts"><span><strong>21</strong>道情境题</span><span><strong>6</strong>个观察维度</span><span>无需登录</span></div>${count?`<div class="resume">本机已有 ${count} / 21 题的作答记录。<br><button class="secondary" id="resume">${finished?'查看上次结果':'继续作答'}</button> <button class="text-button" id="reset-home">清空记录</button></div>`:''}<ul class="instructions"><li>选择最近一段时间里，最接近你真实反应的选项。</li><li>每题单选，没有标准答案，也不需要选“更好”的那个。</li><li>答完即可查看六维雷达图和文字解读。</li></ul><button class="primary wide" id="start">${count?'回到第一题':'开始自测'}</button><p class="fine">这是自我观察与娱乐问卷，未经心理测量学验证，不提供诊断、能力评级或人群排名。作答在你的浏览器内完成，网站不收集答案。</p><details><summary>计分与隐私说明</summary><p>各选项按本问卷定义记 0–3 分。总分为 21 题得分之和除以 63，再换算为 0–100；六个维度分别按所属题目计算平均分。分数越高，代表本次回答中相应倾向越常出现。</p><p>结果文案来自固定规则，不调用 AI。分组、阈值和建议由本问卷编写者设置，不代表经过验证的心理量表。本网站不要求提供姓名、电话或其他个人信息；托管服务可能保留常规访问日志。</p></details></section>`;document.querySelector('#start').onclick=()=>{current=0;finished=false;returnToReview=false;question();};if(count){document.querySelector('#resume').onclick=()=>{finished?report():question();};document.querySelector('#reset-home').onclick=resetPrompt;}}
function question(){const q=questions[current];const completed=answers.filter(v=>v!==null).length;main.innerHTML=`<section aria-label="问卷作答"><div class="progress-meta"><span>第 <strong>${current+1}</strong> / 21 题</span><span>已完成 ${completed} 题</span></div><progress max="21" value="${completed}" aria-label="答题进度"></progress><h1 class="question-title" id="question-title">${escape(q.text)}</h1><p class="hint">选最接近你的一个反应。</p><fieldset class="choices" aria-labelledby="question-title"><legend class="sr-only">本题选项</legend>${q.order.map((v,i)=>`<label class="option"><input type="radio" name="answer" value="${v}" ${answers[current]===v?'checked':''}><span class="letter" aria-hidden="true">${'ABCD'[i]}</span><span class="option-text">${escape(q.options[v].text)}</span></label>`).join('')}</fieldset><div class="question-actions"><button class="secondary" id="prev" ${current===0?'disabled':''}>上一题</button><button class="primary" id="next" ${answers[current]===null?'disabled':''}>${returnToReview?'保存修改':current===20?'查看结果':'下一题'}</button></div><p class="fine storage-note" id="storage-note">${storageText()}</p><button class="text-button" id="home">稍后继续</button></section>`;main.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{answers[current]=Number(input.value);finished=false;save();document.querySelector('#next').disabled=false;main.querySelector('progress').value=answers.filter(v=>v!==null).length;main.querySelector('.progress-meta span:last-child').textContent='已完成 '+answers.filter(v=>v!==null).length+' 题';document.querySelector('#storage-note').textContent=storageText();}));document.querySelector('#prev').onclick=()=>{current--;save();question();};document.querySelector('#next').onclick=()=>{if(answers[current]===null)return;if(returnToReview){returnToReview=false;review();return;}if(current<20){current++;save();question();}else if(answers.some(v=>v===null)){current=answers.findIndex(v=>v===null);question();}else{finished=true;save();report();}};document.querySelector('#home').onclick=()=>{save();home();focusMain();};focusMain();}
function point(i,r,cx=220,cy=188){const a=(-90+i*60)*Math.PI/180;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];}
function polygon(r){return dimensions.map((_,i)=>point(i,r).join(',')).join(' ');}

function report(){try{result=calculate(answers);}catch{current=answers.findIndex(v=>v===null);question();return;}finished=true;save();const r=result;main.innerHTML=`<article id="report"><div class="result-top"><div><h1>你的自我刻度</h1><p class="fine">基于本次 21 题作答</p></div><div class="score-block"><strong>${r.total}</strong><span> / 100</span><p class="fine">自我要求指数</p></div></div><h2 class="result-title">${escape(r.title)}</h2><p class="result-summary">${escape(r.summary)}</p><section class="radar-section" aria-label="六维分数"><figure style="margin:0">${radar(r)}<figcaption class="fine chart-note">越靠近外圈，该倾向在本次回答中越明显。</figcaption></figure><div>${r.scores.map(d=>`<div class="metric"><span>${d.name}</span><strong>${d.value}<span class="fine"> / 100</span></strong><small>${d.level}</small></div>`).join('')}</div></section><section class="section-rule"><h2>分开看，哪里让你更费力</h2>${r.scores.map(d=>`<section class="reading"><div class="reading-head"><h3>${d.name}</h3><span>${d.value} 分 · ${d.level}</span></div><p>${d.reading}</p><p class="suggestion"><strong>可以试试：</strong>${d.action}</p></section>`).join('')}</section><p class="fine" style="margin-top:24px">分数仅反映本次自述，没有高低优劣之分。现实环境、近期压力和答题时的状态都会影响选择。这份问卷未经心理测量学验证，不能据此作心理诊断或评价个人能力。</p><div class="report-actions"><button class="primary" id="download">保存结果长图</button><button class="secondary" id="text-report">下载文字报告</button><button class="secondary" id="review">核对答案</button><button class="secondary" id="print">打印 / 存为 PDF</button><button class="text-button" id="restart">重新开始</button></div><p class="status" id="status" role="status"></p><details><summary>这些分数是怎么算的？</summary><p>总分 = 21 题选项得分之和 ÷ 63 × 100。每题计 0–3 分。各维度为该维度题目得分之和 ÷（题数 × 3）× 100，四舍五入为整数。选项排列不代表分值大小。</p><p>0–33 分显示“较少出现”，34–66 分显示“有时出现”，67–100 分显示“较常出现”。这些区间是内容分组规则，不是医学界限或常模排名。六个维度题数不同，总分不等于六维分数的简单平均。</p><p>整体最高维度低于34时显示“留出余地”；至少四维达到67时显示“多个方向”；其余按最高维度解释，并列最高则如实显示并列。相同答案始终得到相同结果。</p><p>${r.scores.map(d=>d.name+'：第 '+questions.filter(q=>dimensions[q.dimension].id===d.id).map(q=>q.id).join('、')+' 题').join('；')}。</p></details></article>`;document.querySelector('#download').onclick=downloadImage;document.querySelector('#text-report').onclick=()=>downloadBlob(new Blob([reportText()],{type:'text/plain;charset=utf-8'}),'自我刻度-文字报告.txt');document.querySelector('#print').onclick=()=>window.print();document.querySelector('#review').onclick=review;document.querySelector('#restart').onclick=resetPrompt;focusMain();}
function review(){main.innerHTML=`<section><h1>核对你的答案</h1><p class="hint">可以修改任何一题，再重新生成结果。</p><ol class="review-list">${questions.map((q,i)=>`<li><h3>${i+1}. ${escape(q.text)}</h3><p>${answers[i]===null?'尚未作答':escape(q.options[answers[i]].text)}</p><button class="secondary edit" data-index="${i}">修改第 ${i+1} 题</button></li>`).join('')}</ol><button class="primary wide" id="back-result">重新生成结果</button></section>`;main.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{current=Number(b.dataset.index);returnToReview=true;question();});document.querySelector('#back-result').onclick=report;focusMain();}
function resetPrompt(){main.innerHTML=`<section class="intro"><h1>开始一次新的作答？</h1><p class="lead">这会清除当前浏览器里的答案。需要保留结果时，请先返回保存报告。</p><div class="report-actions"><button class="primary" id="confirm-reset">清空并重新开始</button><button class="secondary" id="cancel-reset">返回</button></div></section>`;document.querySelector('#confirm-reset').onclick=()=>{answers=Array(21).fill(null);current=0;finished=false;returnToReview=false;result=null;save();question();};document.querySelector('#cancel-reset').onclick=()=>{finished?report():home();};focusMain();}
function reportText(){return ['自我刻度 · 优绩主义自测','自我要求指数：'+result.total+'/100',result.title,result.summary,'',...result.scores.flatMap(d=>[d.name+' '+d.value+'/100 · '+d.level,d.reading,'可以试试：'+d.action,'']),'本问卷用于自我观察与娱乐，未经心理测量学验证，不提供诊断或人群排名。','',...questions.map((q,i)=>`${i+1}. ${q.text}\n你的选择：${q.options[answers[i]].text}`)].join('\n');}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);const s=document.querySelector('#status');if(s)s.textContent='已生成文件。若浏览器未弹出保存，请检查下载列表。';}
async function downloadImage(){const btn=document.querySelector('#download'),status=document.querySelector('#status');btn.disabled=true;btn.textContent='正在生成…';try{const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=5000;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('canvas');const css=getComputedStyle(document.documentElement);const ink=css.getPropertyValue('--ink').trim(),paper=css.getPropertyValue('--paper').trim(),muted=css.getPropertyValue('--muted').trim(),line=css.getPropertyValue('--line').trim();ctx.fillStyle=paper;ctx.fillRect(0,0,1000,5000);let y=70;function text(t,size=26,color=ink,weight=400){ctx.font=`${weight} ${size}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;ctx.fillStyle=color;const chars=Array.from(t);let row='';for(const c of chars){if(ctx.measureText(row+c).width>860&&!('，。！？；：、）】》”’'.includes(c))){ctx.fillText(row,70,y);y+=size*1.6;row=c;}else row+=c;}if(row){ctx.fillText(row,70,y);y+=size*1.6;}}text('自我刻度 · 优绩主义自测',26,muted);y+=12;text(result.title,42,ink,600);text('自我要求指数 '+result.total+' / 100',30);y+=12;text(result.summary,26,muted);y+=12;
const svg=main.querySelector('.radar').cloneNode(true);const styles=document.createElementNS('http://www.w3.org/2000/svg','style');styles.textContent=`.radar-grid{fill:none;stroke:${line};stroke-width:1}.radar-axis{stroke:${line};stroke-width:1}.radar-shape{fill:${ink};fill-opacity:.09;stroke:${ink};stroke-width:2}.radar-dot{fill:${ink}}text{font-family:sans-serif;font-size:16px;fill:${ink}}.scale{font-size:14px;fill:${muted}}`;svg.prepend(styles);const src=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();try{await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('timeout')),8000);img.onload=()=>{clearTimeout(timer);resolve();};img.onerror=()=>{clearTimeout(timer);reject(new Error('image'));};img.src=src;});ctx.drawImage(img,150,y,700,614);y+=630;}finally{URL.revokeObjectURL(src);}for(const d of result.scores){ctx.strokeStyle=line;ctx.beginPath();ctx.moveTo(70,y);ctx.lineTo(930,y);ctx.stroke();y+=44;text(`${d.name}   ${d.value} / 100 · ${d.level}`,28,ink,600);text(d.reading,23,muted);text('可以试试：'+d.action,23);y+=20;}text('仅供自我观察与娱乐，未经心理测量学验证。',20,muted);text('分数不用于诊断、能力评级或人群排名。',20,muted);const trimmed=document.createElement('canvas');trimmed.width=1000;trimmed.height=y+45;trimmed.getContext('2d').drawImage(canvas,0,0);const blob=await new Promise(resolve=>trimmed.toBlob(resolve,'image/png'));if(!blob)throw new Error('export');downloadBlob(blob,'自我刻度-六维结果.png');}catch{status.textContent='长图生成失败。可以下载文字报告，或使用“打印 / 存为 PDF”。';}finally{btn.disabled=false;btn.textContent='保存结果长图';}}
home();
